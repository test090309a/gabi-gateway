api_key: sysop
auto_commands:
- command: web_search
  pattern: suche.*
- command: web_search
  pattern: was ist.*
auto_exploration:
  check_interval_seconds: 1800
  idle_minutes: 60
calendar:
  enabled: false
chat:
  enable_code_blocks: true
  enable_lists: true
  format_markdown: true
comfyui:
  host: 127.0.0.1
  port: 8188
gmail:
  credentials_path: credentials.json
  enabled: true
  token_path: token.json
host: 0.0.0.0
log_level: INFO
logging:
  level: DEBUG
  loggers:
    corpus_callosum: DEBUG
    http_api: DEBUG
    ollama: DEBUG
    self_correction: DEBUG
memory:
  max_entries: 100
  max_size: 10000
ollama:
  auto_max_model_size_b: 9
  base_url: http://localhost:11434
  default_model: qwen3-vl:4b
  embedding_model: nomic-embed-text:latest
  fast_router_model: qwen2.5:1.5b
  host: 0.0.0.0:11434
  port: 11434
  preferred_code_models:
  - qwen2.5-coder:7b
  - deepseek-coder:6.7b
  preferred_creative_models:
  - llama3.1:8b
  - mistral:latest
  - sparksammy/samantha-uncensored-v5:latest
  preferred_evaluator_models:
  - llama3.1:8b
  preferred_fast_models:
  - llama3.1:8b
  preferred_general_models:
  - llama2:latest
  - mistral:latest
  preferred_vision_models:
  - qwen3-vl:8b
  - llama3.2-vision:11b
  timeout_seconds: 600
port: 8000
self_correction:
  enabled: true
  evaluator_model: llama3.1:8b
  max_iterations: 2
  min_score_threshold: 0.8
  models_per_iteration: 2
  strategy: evaluator
  timeout_per_model: 180
shell:
  allowed_commands: []
  max_output_length: 10000
  timeout: 30
telegram:
  bot_token: 8354278904:AAGAvxIsI4x2fWDNNw_EikfOFCWmaio_tPw
  channel_id: '@meinneuerbotfueropenclaw_bot'
  chat_id: 8027970088
  enabled: true
vision:
  auto_click_confidence: 0.75
  enabled: true
  screenshot_dir: screenshots
  webcam_dir: screenshots/webcam
voice_settings:
  max_record_time: 30.0
  min_speech_duration: 0.2
  silence_timeout: 0.8
  vad_threshold: 0.5
webcam:
  enabled: true
  motion_detection: true
  motion_threshold: 25
whisper:
  enabled: true
  host: 127.0.0.1
  language: de
  port: 9090
  server_url: http://127.0.0.1:9090
