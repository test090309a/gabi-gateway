<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GABI Gateway - AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="light-mode">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- Header -->
        <div class="glass rounded-2xl shadow-xl mb-5 p-5">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-r from-blue-500 to-indigo-600">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-semibold">GABI Gateway</h1>
                        <p class="text-xs opacity-70">Intelligenter KI-Assistent</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2">
                        <div id="ollamaStatus" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
                        <span id="ollamaStatusText" class="text-xs">Ollama</span>
                    </div>
                    
                    <!-- Theme Toggle -->
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        <i id="themeIcon" class="fas fa-moon text-gray-600 dark:text-gray-300"></i>
                    </button>
                    
                    <div class="relative">
                        <button id="modelButton" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-2">
                            <i class="fas fa-microchip"></i>
                            <span id="currentModel">Laden...</span>
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <div id="modelDropdown" class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-xl shadow-xl hidden z-30 max-h-80 overflow-y-auto border border-gray-200 dark:border-gray-700">
                            <div class="p-2 border-b border-gray-200 dark:border-gray-700">
                                <input type="text" id="modelSearch" placeholder="Suche..." class="w-full px-3 py-1.5 border rounded-lg text-sm bg-transparent">
                            </div>
                            <div id="modelList" class="py-1"></div>
                        </div>
                    </div>
                    
                    <button id="settingsBtn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        <i class="fas fa-sliders-h text-gray-600 dark:text-gray-300"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Main Grid - Sidebar immer sichtbar -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">
            <!-- Sidebar - Immer sichtbar -->
            <div class="lg:col-span-1">
                <div class="glass rounded-2xl shadow-xl p-4 sticky top-6">
                    <div class="space-y-1">
                        <button onclick="showHelp()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center space-x-3">
                            <i class="fas fa-question-circle text-blue-500 w-5"></i>
                            <span class="text-sm">Hilfe</span>
                        </button>
                        <button onclick="clearChat()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center space-x-3">
                            <i class="fas fa-trash-alt text-red-500 w-5"></i>
                            <span class="text-sm">Chat löschen</span>
                        </button>
                        <button onclick="exportChat()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center space-x-3">
                            <i class="fas fa-download text-green-500 w-5"></i>
                            <span class="text-sm">Exportieren</span>
                        </button>
                        <button onclick="showStatus()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center space-x-3">
                            <i class="fas fa-chart-line text-purple-500 w-5"></i>
                            <span class="text-sm">System Status</span>
                        </button>
                        <button id="telegramModalBtn" class="w-full text-left px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center space-x-3">
                            <i class="fab fa-telegram text-blue-500 w-5"></i>
                            <span class="text-sm">Telegram</span>
                            <span id="telegramBadge" class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-0.5 hidden">0</span>
                        </button>
                    </div>
                    
                    <hr class="my-4 border-gray-200 dark:border-gray-700">
                    
                    <h3 class="font-medium text-sm mb-2 flex items-center">
                        <i class="fas fa-image mr-2 text-pink-500"></i>
                        Bildanalyse
                    </h3>
                    <label class="w-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 py-2 rounded-xl transition flex items-center justify-center space-x-2 cursor-pointer text-sm">
                        <i class="fas fa-upload"></i>
                        <span>Hochladen</span>
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                    </label>
                    
                    <hr class="my-4 border-gray-200 dark:border-gray-700">
                    
                    <div class="text-xs text-center opacity-50">
                        <i class="fas fa-brain"></i> Corpus Callosum
                    </div>
                </div>
            </div>
            
            <!-- Chat Area -->
            <div class="lg:col-span-3">
                <div class="glass rounded-2xl shadow-xl flex flex-col h-[calc(100vh-160px)] overflow-hidden">
                    <!-- Chat Messages -->
                    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3">
                        <div class="text-center opacity-50 py-12">
                            <i class="fas fa-comment-dots text-4xl mb-2"></i>
                            <p class="text-sm">Willkommen bei GABI</p>
                            <p class="text-xs mt-1">Sage "Hey GABI" für Sprachsteuerung</p>
                        </div>
                    </div>
                    
                    <!-- Input Area mit Wake Word Status -->
                    <div class="input-area border-t p-4">
                        <!-- Wake Word Status Bar -->
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-3">
                                <div id="wakeIndicator" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
                                <span id="wakeWordStatus" class="text-xs opacity-70">🎤 Bereit</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button id="wakeToggleBtn" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                                    <i class="fas fa-microphone-alt mr-1"></i>
                                    <span id="wakeToggleText">Zuhören aus</span>
                                </button>
                                <button id="voiceBtn" class="px-3 py-1 rounded-full text-xs font-medium bg-green-500 hover:bg-green-600 text-white transition">
                                    <i class="fas fa-microphone mr-1"></i>
                                    <span>Mikrofon</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Text Input -->
                        <div class="flex space-x-2">
                            <textarea id="messageInput" rows="1" placeholder="Nachricht eingeben... (Enter sendet)" 
                                class="flex-1 px-4 py-2 border rounded-xl resize-none focus:outline-none focus:ring-1 focus:ring-blue-500 bg-transparent text-sm"></textarea>
                            <button id="sendBtn" class="btn-primary text-white px-5 py-2 rounded-xl transition text-sm">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                            <button id="stopBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl transition hidden">
                                <i class="fas fa-stop"></i>
                            </button>
                        </div>
                        <p id="voiceStatus" class="text-xs opacity-50 mt-2 text-center"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden modal-overlay">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-semibold mb-4">Einstellungen</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">API Key</label>
                    <input type="password" id="apiKey" class="w-full border rounded-xl px-3 py-2 bg-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Ollama URL</label>
                    <input type="text" id="ollamaUrl" class="w-full border rounded-xl px-3 py-2 bg-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Standard-Modell</label>
                    <input type="text" id="defaultModel" class="w-full border rounded-xl px-3 py-2 bg-transparent">
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button onclick="closeSettings()" class="px-4 py-2 border rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700">Abbrechen</button>
                    <button onclick="saveSettings()" class="px-4 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">Speichern</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Telegram Modal -->
    <div id="telegramModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden modal-overlay">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-2xl max-h-[80vh] flex flex-col mx-4">
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-semibold flex items-center">
                    <i class="fab fa-telegram text-blue-500 mr-2"></i>
                    Telegram Nachrichten
                </h3>
                <div class="flex items-center space-x-2">
                    <button id="refreshTelegramModalBtn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button id="closeTelegramModalBtn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="telegramModalMessages" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center opacity-50 py-8">
                    <i class="fab fa-telegram text-4xl mb-2"></i>
                    <p>Keine Telegram-Nachrichten</p>
                </div>
            </div>
            <div class="p-4 border-t dark:border-gray-700">
                <div class="flex space-x-2">
                    <input type="text" id="telegramMessageInput" placeholder="Nachricht senden..." class="flex-1 px-4 py-2 border rounded-xl bg-transparent">
                    <button id="sendTelegramMessageBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl">Senden</button>
                </div>
            </div>
        </div>
    </div>

<script src="/static/script.js"></script>
</body>
</html>
